name: forge

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # No public fallback. The tests fork at a pinned block, so every read is an archive request, and the free
  # endpoints refuse those. An unset secret should fail plainly rather than as a stream of RPC errors.
  ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Install Soldeer dependencies
        run: forge soldeer install

      - name: Forge fmt
        run: forge fmt --check

      - name: Forge build
        run: forge build

      - name: Forge test
        run: forge test -vvv
